name: minio

services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    env_file:
      - minio.env
    ports:
      - "9002:9000"  # S3 API (9000/9001 already used by RustFS)
      - "9003:9001"  # Web console
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - thesis-net

volumes:
  minio-data:

networks:
  thesis-net:
    external: true
