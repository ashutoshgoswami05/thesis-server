name: minio

# VPS copy: every published port is bound to 127.0.0.1 so the backend is
# reachable from the measurement host only. The harness connects over
# localhost and warp over thesis-net, so neither is affected. To reach
# Grafana or Prometheus from a laptop, tunnel instead:
#     ssh -L 3000:localhost:3000 -L 9090:localhost:9090 thesis

services:
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    env_file:
      - minio.env
    ports:
      - "127.0.0.1:9002:9000"  # S3 API (9000/9001 already used by RustFS)
      - "127.0.0.1:9003:9001"  # Web console
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - thesis-net

volumes:
  minio-data:

networks:
  thesis-net:
    external: true
