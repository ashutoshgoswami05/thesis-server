name: garage

# VPS copy: every published port is bound to 127.0.0.1 so the backend is
# reachable from the measurement host only. The harness connects over
# localhost and warp over thesis-net, so neither is affected. To reach
# Grafana or Prometheus from a laptop, tunnel instead:
#     ssh -L 3000:localhost:3000 -L 9090:localhost:9090 thesis

services:
  garage:
    image: dxflrs/garage@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: garage
    env_file:
      - garage.env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/data
    ports:
      - "127.0.0.1:3900:3900"  # S3 API
      - "127.0.0.1:3903:3903"  # Admin API (used later for /metrics)
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    networks:
      - thesis-net

volumes:
  garage-data:

networks:
  thesis-net:
    external: true
